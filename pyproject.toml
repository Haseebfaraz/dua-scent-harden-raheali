[project]
name = "dua-scent-ai-python"
version = "0.1.0"
description = "DUA Scent AI Core Backend -- FastAPI service for the fragrance blend-builder recommendation engine, conversation orchestration, and Odoo inventory integration."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# live_ai tests make real, paid OpenAI calls (agent + simulator + judge models) and can take a
# long time -- excluded by default so a bare `pytest` run never triggers them by accident. Run
# them explicitly with `pytest -m live_ai` (overrides this default marker filter).
addopts = "-m 'not live_ai'"
markers = [
    "live_ai: makes real, paid OpenAI API calls -- excluded from the default run, opt in with -m live_ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
