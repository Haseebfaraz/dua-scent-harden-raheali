# Render Blueprint for the DUA Scent AI Core Backend. No real secrets here -- every value below
# is either a placeholder Render will prompt for (sync: false) or a literal, non-sensitive default.
services:
  - type: web
    name: dua-scent-ai-python
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir .
    # --no-access-log: the app already logs one line per request (method/path/status) without the
    # query string; uvicorn's access log would record preview URLs that carry a capability token.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_TEMPERATURE
        value: "0.3"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_COPY_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_COPY_TEMPERATURE
        value: "0.5"
      - key: ODOO_PING_URL
        sync: false
      - key: ODOO_INVENTORY_URL
        sync: false
      - key: ODOO_INVENTORY_API_KEY
        sync: false
      - key: ODOO_INVENTORY_CACHE_TTL_SECONDS
        value: "60"
      - key: CUSTOMER_KEY_HASH_SALT
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://test-3d-products.myshopify.com"
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      # Render's edge proxy is the one trusted hop that appends the real client IP to X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ABUSE_IDENTITY_HASH_KEY
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: "read_products,write_products,write_inventory,read_publications,write_publications,unauthenticated_read_product_listings,write_app_proxy"
      - key: SHOPIFY_API_VERSION
        value: "2025-04"
