# Render Blueprint for the DUA Scent AI Core Backend. No real secrets here -- every value below
# is either a placeholder Render will prompt for (sync: false) or a literal, non-sensitive default.
#
# B17 (docs/PLATFORM_MODERNIZATION.md section 12): the service is built from the committed
# Dockerfile, i.e. the SAME artifact that scripts/image_smoke.sh verifies (hash-locked
# requirements.txt, application installed with --no-deps, non-root user, `exec uvicorn` as PID 1,
# --no-access-log --no-server-header). Before this change the blueprint used `runtime: python` with
# `pip install .`, which re-resolved every dependency at deploy time and ran nothing that had been
# tested. A platform builds the Dockerfile's LAST stage (there is no target selection in the
# Blueprint spec), which is the serving stage on purpose; the operator `ops` stage is never the
# web service. Migrations are NOT applied by the service: see README "Deployment".
#
# This file describes services created or synced FROM this blueprint. It does not change an
# already-existing Render service, its tracked branch, or its auto-deploy setting.
services:
  - type: web
    name: dua-scent-ai-python
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand: the Dockerfile CMD is the verified start command and binds $PORT
    # (Render sets PORT; the image defaults it to 8000 when unset).
    # Nothing deploys on a git push unless an operator changes this deliberately (the Blueprint
    # default would be `commit`).
    autoDeployTrigger: "off"
    # /health is LIVENESS only (it does not touch the database). A service whose migrations are
    # missing passes it and answers 503 on the chat routes; see README "Deployment".
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_TEMPERATURE
        value: "0.3"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_COPY_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_COPY_TEMPERATURE
        value: "0.5"
      - key: ODOO_PING_URL
        sync: false
      - key: ODOO_INVENTORY_URL
        sync: false
      - key: ODOO_INVENTORY_API_KEY
        sync: false
      - key: ODOO_INVENTORY_CACHE_TTL_SECONDS
        value: "60"
      # Phase 5A: the inventory source contract. No defaults. Commerce stays blocked until every
      # one is set truthfully AND the endpoint returns matching evidence
      # (docs/INVENTORY_COMMERCE_SECURITY.md section 2a). None of them is a bypass.
      - key: ODOO_INVENTORY_LOCATION_SCOPE
        sync: false
      - key: ODOO_INVENTORY_QUANTITY_SEMANTICS
        sync: false
      - key: MANUFACTURING_MAX_OIL_ML_PER_BOTTLE
        sync: false
      - key: CUSTOMER_KEY_HASH_SALT
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://test-3d-products.myshopify.com"
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      # Render's edge proxy is the one trusted hop that appends the real client IP to X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ABUSE_IDENTITY_HASH_KEY
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: "read_products,write_products,write_inventory,read_publications,write_publications,unauthenticated_read_product_listings,write_app_proxy"
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
